<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>캐릭터 표정 모아보기</title>
<style>
 body{margin:0;background:#F4F3EF;font-family:'Malgun Gothic',sans-serif;padding:8px}
 h2{margin:16px 8px 6px;font-size:18px;color:#2C6E49}
 .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
 .cell{background:#fff;border:1px solid #E4E2DB;border-radius:12px;text-align:center;padding-bottom:6px}
 .cell h3{margin:7px;font-size:14px;color:#57625D}
 .box{height:250px}
 .box svg{height:100%;width:auto;display:block;margin:0 auto}
</style></head>
<body>
<div id="out"></div>
<script type="module">
import { Avatar, CHARACTERS, CHARACTER_LIST } from './avatar.js';
const emos=['neutral','happy','excited','sad','worried','surprised','love','thinking','proud','happy'];
const out=document.getElementById('out');

for (const id of CHARACTER_LIST) {
  const h=document.createElement('h2');
  h.textContent = CHARACTERS[id].name + ' — ' + CHARACTERS[id].tagline;
  out.appendChild(h);
  const g=document.createElement('div'); g.className='grid'; out.appendChild(g);

  emos.forEach((e,i)=>{
    const talking = (i===9);
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML='<h3>'+e+(talking?' (말하는 중)':'')+'</h3><div class="box"></div>';
    g.appendChild(cell);
    const a=new Avatar(cell.querySelector('.box'), id);
    a.destroy();
    a.setEmotion(e);
    if(talking){a.setSpeaking(true);a.setMouth(0.95);}
    for(let f=0;f<180;f++){a.t+=1/60;a.blinkAt=99;a.blink=0;a._update(1/60);}
  });
}
</script></body></html>
