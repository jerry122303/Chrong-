<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F5F4F0" />
  <title>초롱이 — 무엇을 함께 할까요</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦜</text></svg>" />
  <style>
    /* 이 화면만 세로로 길어질 수 있게 (styles.css 는 대화 화면을 한 화면에 가둔다) */
    html, body { height: auto; }
    body { display: block; overflow: auto; }
  </style>
</head>
<body class="fs-2">

  <!-- 무엇을 함께 할지 먼저 고른다. 말동무(아바타)는 들어가서 고르거나 바꾼다 -->
  <main class="choose">
    <div class="choose-inner">
      <h1 class="choose-title">오늘은 무엇을 함께 할까요?</h1>
      <p class="choose-desc">고르시면 바로 이야기를 시작해요. 말동무는 들어가서 바꾸실 수 있어요.</p>

      <div class="choose-cards">
        <a class="choose-card" href="/health.html">
          <span class="choose-art" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" stroke="#2C6E49" stroke-width="3.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 100C60 100 22 76 22 50a19 19 0 0 1 38-8 19 19 0 0 1 38 8c0 26-38 50-38 50z"/>
              <path d="M28 62h16l7-13 9 26 7-13h25" stroke="#C9921A"/>
            </svg>
          </span>
          <span class="choose-name">건강관리 이야기</span>
          <p class="choose-what">
            오늘 기분과 몸 상태를 함께 살피고, 하고 싶은 것을 스스로 정해 실천을 이어갑니다.
            약·통증 기록과 오늘의 리포트도 여기 있습니다.
          </p>
        </a>

        <a class="choose-card" href="/recall.html">
          <span class="choose-art" aria-hidden="true">
            <svg viewBox="0 0 120 120" fill="none" stroke="#2C6E49" stroke-width="3.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="16" y="26" width="88" height="68" rx="8"/>
              <circle cx="42" cy="50" r="8"/>
              <path d="M18 84l24-22 20 18 14-12 24 20" stroke="#C9921A"/>
            </svg>
          </span>
          <span class="choose-name">사진 보며 옛이야기</span>
          <p class="choose-what">
            올려 두신 사진을 한 장씩 보며 그때의 기억을 편하게 이야기합니다.
            정답을 맞히는 자리가 아니라, 떠오르는 대로 들려주시면 됩니다.
          </p>
        </a>
      </div>

      <p class="choose-desc" style="margin-top: 26px;">
        사진을 등록하거나 기록을 살펴보시려면
        <a href="/memories.html" style="color: var(--brand); font-weight: 700;">보호자 화면</a>으로 가세요.
      </p>
    </div>
  </main>

</body>
</html>
